<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Premium Estimator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 350px; }
        input, button { width: 100%; padding: 12px; margin-top: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #3b82f6; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: #2563eb; }
        .result { margin-top: 20px; font-size: 1.2rem; text-align: center; color: #38bdf8; }
    </style>
</head>
<body>

<div class="card">
    <h2>Term Estimate Tool</h2>
    <label>Current Age:</label>
    <input type="number" id="age" value="30">
    
    <label>Coverage Amount ($):</label>
    <input type="number" id="coverage" value="500000">

    <button onclick="calculateRate()">Calculate Rate</button>

    <div class="result" id="output">Monthly: $0.00</div>
</div>

<script>
    function calculateRate() {
        const age = document.getElementById('age').value;
        const coverage = document.getElementById('coverage').value;
        
        const baseRatePerThousand = 0.08; 
        const ageMultiplier = 1 + (age - 20) * 0.04;
        
        const monthlyPremium = (coverage / 1000) * baseRatePerThousand * ageMultiplier / 12;
        
        document.getElementById('output').innerHTML = `Est. Monthly: $${monthlyPremium.toFixed(2)}`;
    }
</script>

</body>
</html>
