<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LOOP: Behavioral Mirror</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #050b14;
            color: #38bdf8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
        }
        .system-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #64748b;
            margin-bottom: 15px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        h2 {
            font-size: 1.25rem;
            color: #f8fafc;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button.choice-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        button.choice-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: #38bdf8;
            color: #38bdf8;
            padding-left: 22px;
        }
        .profile-box {
            background: #111827;
            border-left: 3px solid #38bdf8;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-top: 15px;
        }
        .profile-title {
            color: #4ade80;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Dynamic content injects here -->
    </div>

    <script>
        // DISC scores tracker
        let scores = { D: 0, I: 0, S: 0, C: 0 };
        let currentScene = 0;

        // Story Scenarios with hidden DISC triggers
        const scenes = [
            {
                prompt: "SYSTEM ALERT: Facility lockdown initiated by an unknown backdoor script. Security patrol units are closing in on your sector in 60 seconds. What is your immediate protocol?",
                choices: [
                    { text: "[A] Smash the emergency manual override panel and force the heavy bulkhead door open yourself.", trait: "D" },
                    { text: "[B] Broadcast an open audio channel pretending to be the lead system architect to bluff security away.", trait: "I" },
                    { text: "[C] Fall back to the secure anchor point and wait for your partner to group up before moving.", trait: "S" },
                    { text: "[D] Pull up the terminal diagnostic logs to analyze the exact error code causing the lockdown loop.", trait: "C" }
                ]
            },
            {
                prompt: "You reach the main network core terminal, but the interface requires a biometric override sequence or a brute-force decryption command. Time is running out.",
                choices: [
                    { text: "[A] Punch the bypass command sequence rapidly and risk short-circuiting the firewall.", trait: "D" },
                    { text: "[B] Rapidly message the outer perimeter team to see if anyone has a live override key you can borrow.", trait: "I" },
                    { text: "[C] Take a steady breath, isolate the stable nodes, and proceed step-by-step without errors.", trait: "S" },
                    { text: "[D] Cross-reference the system architecture schematics to find the primary maintenance loophole.", trait: "C" }
                ]
            },
            {
                prompt: "The escape elevator doors are jammed halfway. You can see daylight through the crack, but something is blocking the tracks from fully retracting.",
                choices: [
                    { text: "[A] Wedge a steel pipe into the frame and muscle the doors open by sheer force.", trait: "D" },
                    { text: "[B] Yell out to anyone left in the facility corridor to come give you a hand pushing it.", trait: "I" },
                    { text: "[C] Carefully clear the debris path millimeter by millimeter to ensure structural safety.", trait: "S" },
                    { text: "[D] Inspect the mechanical gear box layout to locate the emergency clutch release pin.", trait: "C" }
                ]
            }
        ];

        function renderScene() {
            const app = document.getElementById("app");

            if (currentScene >= scenes.length) {
                renderEnding();
                return;
            }

            let scene = scenes[currentScene];
            let html = `
                <div class="system-header">
                    <span>Simulation Node 0${currentScene + 1} / 0${scenes.length}</span>
                    <span>Telemetry: Active</span>
                </div>
                <h2>${scene.prompt}</h2>
                <div class="choices-container">
            `;

            scene.choices.forEach((choice, index) => {
                html += `<button class="choice-btn" onclick="makeChoice('${choice.trait}')">${choice.text}</button>`;
            });

            html += `</div>`;
            app.innerHTML = html;
        }

        function makeChoice(trait) {
            scores[trait]++;
            currentScene++;
            renderScene();
        }

        function renderEnding() {
            const app = document.getElementById("app");

            // Find dominant trait
            let dominantTrait = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            
            let profileHeading = "";
            let profileDescription = "";

            if (dominantTrait === "D") {
                profileHeading = "Behavioral Signature: High Dominance [D]";
                profileDescription = "When faced with systemic friction, your immediate instinct is brute-force velocity. You prefer breaking doors over looking for keys. You carry an intense need for control and absolute results, often viewing caution as a waste of precious time.";
            } else if (dominantTrait === "I") {
                profileHeading = "Behavioral Signature: High Influence [I]";
                profileDescription = "You lean heavily on perception, communication, and social engineering. Under acute stress, your default reflex is connection and improvisation rather than isolation. You trust human variables over static structures.";
            } else if (dominantTrait === "S") {
                profileHeading = "Behavioral Signature: High Steadiness [S]";
                profileDescription = "You value stability, pacing, and collaborative safety above all else. When chaos erupts around you, you look for anchors, group alignment, and predictable increments. You resist erratic risks and impulsive gambles.";
            } else {
                profileHeading = "Behavioral Signature: High Conscientiousness [C]";
                profileDescription = "You are a creature of structural logic and precision. When systems lock down, you don't panic or force your way through—you read the fine print. You trust data and code over people, seeking perfection and flaw-free execution.";
            }

            app.innerHTML = `
                <div class="system-header">
                    <span>Simulation Terminated</span>
                    <span>Status: Analyzed</span>
                </div>
                <h2 style="color: #4ade80; margin-bottom: 10px;">Subject Assessment Compiled</h2>
                <div class="subtext" style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px;">
                    Telemetry recorded across ${scenes.length} crisis decision points.
                </div>
                
                <div class="profile-box">
                    <div class="profile-title">${profileHeading}</div>
                    <p>${profileDescription}</p>
                    <br>
                    <p style="font-size: 0.8rem; color: #64748b;">Raw Metrics — D: ${scores.D} | I: ${scores.I} | S: ${scores.S} | C: ${scores.C}</p>
                </div>

                <button class="choice-btn" style="margin-top: 20px; text-align: center;" onclick="location.reload()">RE-RUN SIMULATION ⟳</button>
            `;
        }

        // Initialize first scene
        renderScene();
    </script>
</body>
</html>
