<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Bowman - Vertical iOS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none; /* Prevents mobile scrolling and zooming gestures */
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100vw;
        }
        h1 {
            margin-bottom: 2px;
            font-size: 1.3rem;
            color: #38bdf8;
            letter-spacing: 2px;
        }
        .status-hud {
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            padding: 0 10px;
        }
        .canvas-container {
            width: 92vw;
            max-width: 420px;
            aspect-ratio: 9 / 16; /* Perfect vertical phone proportion */
            position: relative;
        }
        canvas {
            background: linear-gradient(to bottom, #020617, #1e293b);
            border: 3px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            height: 100%;
            display: block;
        }
        .controls-hint {
            margin-top: 8px;
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>BOWMAN VERTICAL</h1>
    <div class="status-hud" id="hudText">Player 1's Turn: Drag & Release to Shoot!</div>
    
    <div class="canvas-container">
        <canvas id="gameCanvas" width="400" height="711"></canvas>
    </div>

    <div class="controls-hint">Hold & Drag anywhere to aim trajectory</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game State
        let turn = 1; // 1 for Player 1, 2 for Player 2
        let wind = (Math.random() * 0.3) - 0.15; // Random wind factor
        let gameState = "AIMING"; // AIMING, FLYING, GAME_OVER

        // Vertical Layout Positions (P1 at bottom, P2 at top)
        const p1 = { x: 200, y: 600, health: 100, color: "#38bdf8" };
        const p2 = { x: 200, y: 110, health: 100, color: "#f43f5e" };

        // Active Arrow in flight
        let arrow = { x: 0, y: 0, vx: 0, vy: 0, active: false };

        // Aiming interaction inputs with scaling calculation for mobile viewports
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let currentDragX = 0;
        let currentDragY = 0;

        canvas.addEventListener("pointerdown", (e) => {
            if (gameState !== "AIMING") return;
            isDragging = true;
            const rect = canvas.getBoundingClientRect();
            const scaleX = 400 / rect.width;
            const scaleY = 711 / rect.height;
            
            dragStartX = (e.clientX - rect.left) * scaleX;
            dragStartY = (e.clientY - rect.top) * scaleY;
            currentDragX = dragStartX;
            currentDragY = dragStartY;
        });

        canvas.addEventListener("pointermove", (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = 400 / rect.width;
            const scaleY = 711 / rect.height;

            currentDragX = (e.clientX - rect.left) * scaleX;
            currentDragY = (e.clientY - rect.top) * scaleY;
        });

        canvas.addEventListener("pointerup", (e) => {
            if (!isDragging) return;
            isDragging = false;

            let shooter = turn === 1 ? p1 : p2;
            let dx = dragStartX - currentDragX; // Pulling back launches forward
            let dy = dragStartY - currentDragY;

            arrow.x = shooter.x;
            arrow.y = shooter.y - 25;
            arrow.vx = dx * 0.12;
            arrow.vy = dy * 0.12;
            arrow.active = true;
            gameState = "FLYING";
            document.getElementById("hudText").innerText = "Shot Fired!";
        });

        function updatePhysics() {
            if (!arrow.active) return;

            // Apply gravity and wind
            arrow.vy += 0.25; 
            arrow.vx += wind; 

            arrow.x += arrow.vx;
            arrow.y += arrow.vy;

            // Screen boundary check
            if (arrow.x < 0 || arrow.x > 400 || arrow.y > 711 || arrow.y < 0) {
                arrow.active = false;
                checkHitOrMiss(false);
            } else {
                // Check collision with opposing player
                let target = turn === 1 ? p2 : p1;
                let dist = Math.hypot(arrow.x - target.x, arrow.y - target.y);
                if (dist < 20) {
                    arrow.active = false;
                    checkHitOrMiss(true, target);
                }
            }
        }

        function checkHitOrMiss(hit, target) {
            if (hit) {
                target.health -= 35;
                if (target.health <= 0) {
                    target.health = 0;
                    document.getElementById("hudText").innerText = `PLAYER ${turn} WINS THE MATCH!`;
                    gameState = "GAME_OVER";
                    return;
                }
                document.getElementById("hudText").innerText = `Direct Hit! -35 HP`;
            } else {
                document.getElementById("hudText").innerText = `Missed / Out of Bounds!`;
            }

            setTimeout(switchTurn, 1500);
        }

        function switchTurn() {
            if (gameState === "GAME_OVER") return;
            turn = turn === 1 ? 2 : 1;
            wind = (Math.random() * 0.3) - 0.15;
            gameState = "AIMING";
            document.getElementById("hudText").innerText = `Player ${turn}'s Turn (Wind: ${(wind * 10).toFixed(1)})`;
        }

        function drawScene() {
            ctx.clearRect(0, 0, 400, 711);

            // Draw Central dividing canyon line or background separator
            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, 711 / 2);
            ctx.lineTo(400, 711 / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Players (P1 at bottom, P2 at top)
            drawArcher(p1.x, p1.y, p1.color, p1.health, "P1");
            drawArcher(p2.x, p2.y, p2.color, p2.health, "P2");

            // Draw Aiming Vector Line Preview
            if (isDragging && gameState === "AIMING") {
                let shooter = turn === 1 ? p1 : p2;
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(shooter.x, shooter.y - 25);
                let previewX = shooter.x - (currentDragX - dragStartX);
                let previewY = shooter.y - 25 - (currentDragY - dragStartY);
                ctx.lineTo(previewX, previewY);
                ctx.stroke();
            }

            // Draw Flying Arrow
            if (arrow.active) {
                ctx.strokeStyle = "#f8fafc";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(arrow.x, arrow.y);
                ctx.lineTo(arrow.x - arrow.vx * 2, arrow.y - arrow.vy * 2);
                ctx.stroke();
            }
        }

        function drawArcher(x, y, color, health, label) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;

            // Head
            ctx.beginPath();
            ctx.arc(x, y - 35, 8, 0, Math.PI * 2);
            ctx.stroke();

            // Body & Limbs
            ctx.beginPath();
            ctx.moveTo(x, y - 27);
            ctx.lineTo(x, y - 8);
            ctx.moveTo(x, y - 8);
            ctx.lineTo(x - 10, y);
            ctx.moveTo(x, y - 8);
            ctx.lineTo(x + 10, y);
            ctx.stroke();

            // Health bar
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(x - 20, y - 55, 40, 5);
            ctx.fillStyle = color;
            ctx.fillRect(x - 20, y - 55, (health / 100) * 40, 5);
        }

        function gameLoop() {
            updatePhysics();
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
