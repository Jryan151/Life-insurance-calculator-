<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Bowman - Remote Multiplayer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100vw;
        }
        h1 {
            margin-bottom: 2px;
            font-size: 1.2rem;
            color: #38bdf8;
            letter-spacing: 2px;
        }
        .status-hud {
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            padding: 0 10px;
        }
        .room-info {
            font-size: 0.75rem;
            color: #38bdf8;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .canvas-container {
            width: 90vw;
            max-width: 380px;
            aspect-ratio: 9 / 16;
            position: relative;
        }
        canvas {
            background: linear-gradient(to bottom, #020617, #1e293b);
            border: 3px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            height: 100%;
            display: block;
        }
        .controls-hint {
            margin-top: 8px;
            font-size: 0.7rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>BOWMAN ONLINE</h1>
    <div class="room-info" id="roomInfo">Connecting to room...</div>
    <div class="status-hud" id="hudText">Connecting...</div>
    
    <div class="canvas-container">
        <canvas id="gameCanvas" width="400" height="711"></canvas>
    </div>

    <div class="controls-hint">Drag & Release to fire your turn</div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAr9h0NLPquw-ejP0AdHN_pAPlSCBACBp8",
            authDomain: "bowman-game.firebaseapp.com",
            databaseURL: "https://bowman-game-default-rtdb.firebaseio.com",
            projectId: "bowman-game",
            storageBucket: "bowman-game.appspot.com",
            messagingSenderId: "1077764467196",
            appId: "1:1077764467196:web:9a1d0fc6a20cbd4254aa79",
            measurementId: "G-ZR3F5OLJ87"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Room Setup from URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get("room");
        
        if (!roomId) {
            roomId = "room_" + Math.random().toString(36).substring(2, 7);
            window.history.replaceState({}, "", `?room=${roomId}`);
        }
        
        document.getElementById("roomInfo").innerText = `Room Code: ${roomId} | Tap here to copy link`;
        document.getElementById("roomInfo").onclick = () => {
            navigator.clipboard.writeText(window.location.href);
            alert("Game link copied! Send it to your friend.");
        };

        const roomRef = ref(db, 'rooms/' + roomId);
        let myPlayerNum = null;

        // Clean, Bulletproof Connection Initialization
        async function initGame() {
            const snapshot = await get(roomRef);
            
            if (!snapshot.exists()) {
                // First person here creates the room as Player 1
                myPlayerNum = 1;
                await set(roomRef, {
                    turn: 1,
                    p1Health: 100,
                    p2Health: 100,
                    wind: 0.1,
                    gameState: "AIMING",
                    p1Connected: true,
                    p2Connected: false,
                    shotData: null
                });
            } else {
                // Room exists, join as Player 2
                myPlayerNum = 2;
                await update(roomRef, {
                    p2Connected: true
                });
            }

            // Start listening for live updates once our role is locked
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (data) syncGameState(data);
            });
        }

        initGame();

        // Canvas & Game Logic Setup
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let remoteState = {
            turn: 1,
            p1Health: 100,
            p2Health: 100,
            wind: 0.1,
            gameState: "AIMING",
            p2Connected: false
        };

        const p1 = { x: 200, y: 600 };
        const p2 = { x: 200, y: 110 };
        let arrow = { x: 0, y: 0, vx: 0, vy: 0, active: false };

        let isDragging = false;
        let dragStartX = 0, dragStartY = 0, currentDragX = 0, currentDragY = 0;

        canvas.addEventListener("pointerdown", (e) => {
            if (!remoteState.p2Connected || remoteState.gameState !== "AIMING" || remoteState.turn !== myPlayerNum) return;
            isDragging = true;
            const rect = canvas.getBoundingClientRect();
            dragStartX = (e.clientX - rect.left) * (400 / rect.width);
            dragStartY = (e.clientY - rect.top) * (711 / rect.height);
            currentDragX = dragStartX;
            currentDragY = dragStartY;
        });

        canvas.addEventListener("pointermove", (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            currentDragX = (e.clientX - rect.left) * (400 / rect.width);
            currentDragY = (e.clientY - rect.top) * (711 / rect.height);
        });

        canvas.addEventListener("pointerup", () => {
            if (!isDragging) return;
            isDragging = false;

            let shooter = myPlayerNum === 1 ? p1 : p2;
            let vx = (dragStartX - currentDragX) * 0.12;
            let vy = (dragStartY - currentDragY) * 0.12;

            update(roomRef, {
                gameState: "FLYING",
                shotData: {
                    startX: shooter.x,
                    startY: shooter.y - 25,
                    vx: vx,
                    vy: vy,
                    shooterNum: myPlayerNum
                }
            });
        });

        function syncGameState(data) {
            remoteState = data;
            if (data.gameState === "FLYING" && data.shotData && !arrow.active) {
                arrow.x = data.shotData.startX;
                arrow.y = data.shotData.startY;
                arrow.vx = data.shotData.vx;
                arrow.vy = data.shotData.vy;
                arrow.active = true;
            }

            if (!data.p2Connected) {
                document.getElementById("hudText").innerText = `You are P${myPlayerNum}. Waiting for Player 2...`;
            } else if (remoteState.gameState === "AIMING") {
                let isMyTurn = data.turn === myPlayerNum;
                document.getElementById("hudText").innerText = isMyTurn ? "Your Turn to Aim & Shoot!" : `Waiting for P${data.turn}'s shot...`;
            } else if (remoteState.gameState === "FLYING") {
                document.getElementById("hudText").innerText = "Arrow in flight...";
            }
        }

        function updatePhysics() {
            if (!arrow.active) return;

            arrow.vy += 0.25;
            arrow.vx += remoteState.wind;
            arrow.x += arrow.vx;
            arrow.y += arrow.vy;

            let targetPos = remoteState.turn === 1 ? p2 : p1;
            
            if (Math.hypot(arrow.x - targetPos.x, arrow.y - targetPos.y) < 20) {
                arrow.active = false;
                if (myPlayerNum === remoteState.turn) {
                    let newP1Health = remoteState.turn === 1 ? remoteState.p1Health : remoteState.p1Health - 35;
                    let newP2Health = remoteState.turn === 2 ? remoteState.p2Health : remoteState.p2Health - 35;
                    let nextTurn = remoteState.turn === 1 ? 2 : 1;
                    
                    update(roomRef, {
                        p1Health: Math.max(0, newP1Health),
                        p2Health: Math.max(0, newP2Health),
                        turn: nextTurn,
                        gameState: "AIMING",
                        wind: Number(((Math.random() * 0.3) - 0.15).toFixed(2)),
                        shotData: null
                    });
                }
            } else if (arrow.y > 711 || arrow.y < 0 || arrow.x < 0 || arrow.x > 400) {
                arrow.active = false;
                if (myPlayerNum === remoteState.turn) {
                    let nextTurn = remoteState.turn === 1 ? 2 : 1;
                    update(roomRef, {
                        turn: nextTurn,
                        gameState: "AIMING",
                        wind: Number(((Math.random() * 0.3) - 0.15).toFixed(2)),
                        shotData: null
                    });
                }
            }
        }

        function drawScene() {
            ctx.clearRect(0, 0, 400, 711);

            ctx.strokeStyle = "#1e293b";
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, 355); ctx.lineTo(400, 355); ctx.stroke();
            ctx.setLineDash([]);

            drawArcher(p1.x, p1.y, "#38bdf8", remoteState.p1Health, "P1");
            drawArcher(p2.x, p2.y, "#f43f5e", remoteState.p2Health, "P2");

            if (isDragging && remoteState.turn === myPlayerNum) {
                let shooter = myPlayerNum === 1 ? p1 : p2;
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(shooter.x, shooter.y - 25);
                ctx.lineTo(shooter.x - (currentDragX - dragStartX), shooter.y - 25 - (currentDragY - dragStartY));
                ctx.stroke();
            }

            if (arrow.active) {
                ctx.strokeStyle = "#f8fafc";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(arrow.x, arrow.y);
                ctx.lineTo(arrow.x - arrow.vx * 2, arrow.y - arrow.vy * 2);
                ctx.stroke();
            }
        }

        function drawArcher(x, y, color, health, label) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(x, y - 35, 8, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x, y - 27); ctx.lineTo(x, y - 8);
            ctx.moveTo(x, y - 8); ctx.lineTo(x - 10, y);
            ctx.moveTo(x, y - 8); ctx.lineTo(x + 10, y); ctx.stroke();

            ctx.fillStyle = "#1e293b"; ctx.fillRect(x - 20, y - 55, 40, 5);
            ctx.fillStyle = color; ctx.fillRect(x - 20, y - 55, (health / 100) * 40, 5);
        }

        function gameLoop() {
            updatePhysics();
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
