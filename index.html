<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE PASSENGER: Psychological Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #090d16;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }
        .scene-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        h2 {
            font-size: 1.2rem;
            color: #f8fafc;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button.choice-btn {
            background: #1f2937;
            color: #f1f5f9;
            border: 1px solid #374151;
            padding: 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            line-height: 1.4;
        }
        button.choice-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: #38bdf8;
            color: #38bdf8;
            transform: translateX(4px);
        }
        .profile-box {
            background: #0b0f19;
            border-left: 4px solid #38bdf8;
            padding: 20px;
            border-radius: 0 10px 10px 0;
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-top: 15px;
        }
        .profile-title {
            color: #4ade80;
            font-weight: bold;
            font-size: 1.15rem;
            margin-bottom: 8px;
        }
        .subtext {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Content injects here -->
    </div>

    <script>
        let scores = { D: 0, I: 0, S: 0, C: 0 };
        let currentScene = 0;

        const scenes = [
            {
                phase: "Phase 1: Awakening",
                prompt: "You snap awake. Rain is lashing against the car windows. You’re in the passenger seat of your own car, speeding down a dark coastal cliff road at 90 MPH. The driver is a stranger with a blank stare. The radio is playing static. What do you do first?",
                choices: [
                    { text: "Slam your hands onto the steering wheel and violently jerk it to force them to pull over.", trait: "D" },
                    { text: "Laugh nervously, flash a calm smile, and ask them casually where they're taking you.", trait: "I" },
                    { text: "Keep your body steady, grip the seatbelt tightly, and speak in a soft, soothing tone to avoid crashing.", trait: "S" },
                    { text: "Say nothing. Immediately glance down at the dashboard display, check the speedometer, and check the door lock status.", trait: "C" }
                ]
            },
            {
                phase: "Phase 2: The Confrontation",
                prompt: "The driver doesn't answer. Instead, they hit the central door locks—*click*. They reach into their jacket pocket and pull out a burner phone, sliding it onto your lap. It's ringing. An unknown number is flashing on the screen.",
                choices: [
                    { text: "Swat the phone out of their hand, demand answers, and reach for the door handle.", trait: "D" },
                    { text: "Answer the phone immediately and try to talk your way out or charm whoever is on the line.", trait: "I" },
                    { text: "Look over at the driver with deep empathy and ask, 'Who hurt you? We can figure this out together.'", trait: "S" },
                    { text: "Ignore the phone entirely. Instead, look at the reflection in the side mirror to see if anyone is following you.", trait: "C" }
                ]
            },
            {
                phase: "Phase 3: The Crossroads",
                prompt: "Ahead, the road splits. To the left is an unlit tunnel plunging into total darkness. To the right is a police checkpoint blockade with flashing red and blue lights. The driver looks at you, waiting for a command.",
                choices: [
                    { text: "Point sharply to the right and order them: 'Drive straight through the barricade. Do it now.'", trait: "D" },
                    { text: "Give them an upbeat wink and say, 'Trust me, take the tunnel, it'll be way more fun.'", trait: "I" },
                    { text: "Plea for safety, urging them to slow down and pull over near the checkpoint where it's safe for everyone.", trait: "S" },
                    { text: "Weigh the odds: calculate the braking distance, note the wet asphalt, and point out that the tunnel is the only viable physics-based escape route.", trait: "C" }
                ]
            }
        ];

        function renderScene() {
            const app = document.getElementById("app");

            if (currentScene >= scenes.length) {
                renderEnding();
                return;
            }

            let scene = scenes[currentScene];
            let html = `
                <div class="scene-header">
                    <span>${scene.phase}</span>
                    <span>Node 0${currentScene + 1} / 0${scenes.length}</span>
                </div>
                <h2>${scene.prompt}</h2>
                <div class="choices-container">
            `;

            scene.choices.forEach((choice) => {
                html += `<button class="choice-btn" onclick="makeChoice('${choice.trait}')">${choice.text}</button>`;
            });

            html += `</div>`;
            app.innerHTML = html;
        }

        function makeChoice(trait) {
            scores[trait]++;
            currentScene++;
            renderScene();
        }

        function renderEnding() {
            const app = document.getElementById("app");
            let dominantTrait = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            
            let profileHeading = "";
            let profileDescription = "";

            if (dominantTrait === "D") {
                profileHeading = "Psychological Profile: The Force of Nature [High-D]";
                profileDescription = "When thrown into a life-or-death crisis, your absolute first instinct is control and raw velocity. You don't negotiate with kidnappers or look for clues—you wrestle the steering wheel. You despise helplessness and will always choose aggressive action over passive waiting.";
            } else if (dominantTrait === "I") {
                profileHeading = "Psychological Profile: The Silver-Tongued Improviser [High-I]";
                profileDescription = "You treat a nightmare scenario like a social puzzle. When panic sets in, you weaponize charm, casual humor, and human connection. You believe that any dangerous person can be talked down if you say the right words.";
            } else if (dominantTrait === "S") {
                profileHeading = "Psychological Profile: The Steady Anchor [High-S]";
                profileDescription = "Even while speeding down a cliff at 90 MPH, your core priority is emotional equilibrium and safety. You hate erratic chaos and instinctively try to soothe the tension. You protect people first, refusing to let panic make things worse.";
            } else {
                profileHeading = "Psychological Profile: The Cold Strategist [High-C]";
                profileDescription = "You are a master of tactical detachment. While everyone else is screaming, your brain goes straight into diagnostic mode—checking locks, calculating braking distances, and analyzing reflections. You trust cold reality and data over emotional guesswork.";
            }

            app.innerHTML = `
                <div class="scene-header">
                    <span>Simulation Terminated</span>
                    <span>Analysis Complete</span>
                </div>
                <h2 style="color: #4ade80; margin-bottom: 8px;">The Simulation Knows You.</h2>
                <div class="subtext">
                    Evaluated across ${scenes.length} critical survival decisions.
                </div>
                
                <div class="profile-box">
                    <div class="profile-title">${profileHeading}</div>
                    <p>${profileDescription}</p>
                    <br>
                    <p style="font-size: 0.8rem; color: #64748b;">Telemetry Breakdown — Dominance: ${scores.D} | Influence: ${scores.I} | Steadiness: ${scores.S} | Conscientiousness: ${scores.C}</p>
                </div>

                <button class="choice-btn" style="margin-top: 24px; text-align: center; background: #38bdf8; color: #090d16; font-weight: bold;" onclick="location.reload()">EXPERIENCE AGAIN ⟳</button>
            `;
        }

        renderScene();
    </script>
</body>
</html>
