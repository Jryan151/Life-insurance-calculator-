<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Pong - Touch & Upgraded</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none; /* Prevents default mobile scrolling/zooming gestures */
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 1.6rem;
            letter-spacing: 2px;
            color: #38bdf8;
        }
        .meta-info {
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .canvas-container {
            position: relative;
        }
        canvas {
            background-color: #020617;
            border: 4px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: block;
        }
        /* Win state overlay card */
        #gameOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            z-index: 10;
        }
        #gameOverlay h2 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #f8fafc;
            text-align: center;
        }
        #restartBtn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 28px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #restartBtn:hover {
            background-color: #7dd3fc;
        }
        .instructions {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>RETRO PONG</h1>
    <div class="meta-info" id="highScoreDisplay">Session Best Streak: 0</div>
    
    <div class="canvas-container">
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        <div id="gameOverlay">
            <h2 id="winnerText">PLAYER 1 WINS!</h2>
            <button id="restartBtn" onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <div class="instructions">Use <strong>W / S</strong>, <strong>Arrow Keys</strong>, or <strong>Touch & Drag</strong> to move</div>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        // Game State Flags
        let isGameOver = false;
        let winStreak = parseInt(localStorage.getItem("pong_streak")) || 0;
        updateHighScoreText();

        // Game objects
        const player = {
            x: 20,
            y: canvas.height / 2 - 40,
            width: 12,
            height: 80,
            score: 0,
            name: "PLAYER 1",
            color: "#38bdf8",
            speed: 6
        };

        const ai = {
            x: canvas.width - 32,
            y: canvas.height / 2 - 40,
            width: 12,
            height: 80,
            score: 0,
            name: "PLAYER 2",
            color: "#f43f5e",
            speed: 4.5
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 8,
            speed: 5,
            dx: 5,
            dy: 3,
            color: "#f8fafc"
        };

        // Live abstract background particles
        const particles = Array.from({ length: 35 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.5 + 0.2
        }));

        // Keyboard controls
        const keys = {};
        window.addEventListener("keydown", (e) => { keys[e.code] = true; });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        // Touch controls support for iPad / mobile screens
        canvas.addEventListener("touchmove", (e) => {
            if (isGameOver) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touchY = e.touches[0].clientY - rect.top;
            
            // Center the paddle on the touch position vertically
            player.y = touchY - player.height / 2;

            // Keep player inside canvas boundaries
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
            }
        }, { passive: false });

        function handleInput() {
            if (isGameOver) return;
            if (keys["KeyW"] || keys["ArrowUp"]) {
                player.y -= player.speed;
            }
            if (keys["KeyS"] || keys["ArrowDown"]) {
                player.y += player.speed;
            }

            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
            }
        }

        function updateAI() {
            if (isGameOver) return;
            const aiCenter = ai.y + ai.height / 2;
            if (aiCenter < ball.y - 15) {
                ai.y += ai.speed;
            } else if (aiCenter > ball.y + 15) {
                ai.y -= ai.speed;
            }

            if (ai.y < 0) ai.y = 0;
            if (ai.y + ai.height > canvas.height) {
                ai.y = canvas.height - ai.height;
            }
        }

        function moveBall() {
            if (isGameOver) return;

            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall collisions
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy *= -1;
            }

            // Player paddle collision
            if (
                ball.x - ball.radius < player.x + player.width &&
                ball.x + ball.radius > player.x &&
                ball.y > player.y &&
                ball.y < player.y + player.height
            ) {
                ball.dx *= -1;
                let collidePoint = ball.y - (player.y + player.height / 2);
                ball.dy = collidePoint * 0.15;
            }

            // AI paddle collision
            if (
                ball.x + ball.radius > ai.x &&
                ball.x - ball.radius < ai.x + ai.width &&
                ball.y > ai.y &&
                ball.y < ai.y + ai.height
            ) {
                ball.dx *= -1;
                let collidePoint = ball.y - (ai.y + ai.height / 2);
                ball.dy = collidePoint * 0.15;
            }

            // Scoring & Limit Check (Goal: 5 points)
            if (ball.x - ball.radius < 0) {
                ai.score++;
                checkWinCondition();
                if (!isGameOver) resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;
                checkWinCondition();
                if (!isGameOver) resetBall();
            }
        }

        function checkWinCondition() {
            if (player.score >= 5 || ai.score >= 5) {
                isGameOver = true;
                const winnerName = player.score >= 5 ? "PLAYER 1 WINS!" : "PLAYER 2 WINS!";
                document.getElementById("winnerText").innerText = winnerName;
                document.getElementById("gameOverlay").style.display = "flex";

                if (player.score >= 5) {
                    winStreak++;
                    localStorage.setItem("pong_streak", winStreak);
                    updateHighScoreText();
                }
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx *= -1;
            ball.dy = (Math.random() * 4) - 2;
        }

        function resetGame() {
            player.score = 0;
            ai.score =0;
            isGameOver = false;
            document.getElementById("gameOverlay").style.display = "none";
            resetBall();
        }

        function updateHighScoreText() {
            document.getElementById("highScoreDisplay").innerText = `Session Player Win Streak: ${winStreak}`;
        }

        function drawBackground() {
            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(56, 189, 248, 0.15)";
            particles.forEach(p => {
                p.x -= p.speed;
                if (p.x < 0) p.x = canvas.width;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawNet() {
            ctx.strokeStyle = "#1e293b";
            ctx.setLineDash([4, 15]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function draw() {
            drawBackground();
            drawNet();

            ctx.font = "14px 'Courier New', Courier, monospace";
            ctx.textAlign = "center";
            
            ctx.fillStyle = player.color;
            ctx.fillText(player.name, canvas.width / 4, 30);
            ctx.font = "36px 'Courier New', Courier, monospace";
            ctx.fillText(player.score, canvas.width / 4, 75);

            ctx.font = "14px 'Courier New', Courier, monospace";
            ctx.fillStyle = ai.color;
            ctx.fillText(ai.name, (canvas.width / 4) * 3, 30);
            ctx.font = "36px 'Courier New', Courier, monospace";
            ctx.fillText(ai.score, (canvas.width / 4) * 3, 75);

            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = ai.color;
            ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            handleInput();
            updateAI();
            moveBall();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
