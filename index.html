<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Financial Snapshot - DreamCatcher Financial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050b14;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #38bdf8;
            width: 20%;
            transition: width 0.3s ease;
        }
        .step-indicator {
            font-size: 0.75rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        h2 {
            font-size: 1.35rem;
            color: #f8fafc;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .subtext {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input[type="number"] {
            background: #1e293b;
            border: 2px solid #334155;
            color: #f8fafc;
            padding: 16px;
            font-size: 1.1rem;
            border-radius: 10px;
            outline: none;
            text-align: center;
            font-weight: bold;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button.action-btn {
            background: #38bdf8;
            color: #050b14;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s, transform 0.1s;
        }
        button.action-btn:hover {
            background: #7dd3fc;
            transform: translateY(-1px);
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        button.option-tile {
            background: #1e293b;
            color: #f8fafc;
            border: 2px solid #334155;
            padding: 18px 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        button.option-tile:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: #38bdf8;
            color: #38bdf8;
        }
        .value-insight {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid #38bdf8;
            padding: 12px 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            color: #bae6fd;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .scorecard {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .score-title {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .score-value {
            font-size: 2.2rem;
            color: #4ade80;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .score-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.4;
        }
        .summary-list {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #111827;
            padding: 15px;
            border-radius: 8px;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="progressContainer">
            <div id="stepIndicator" class="step-indicator">Step 1 of 5</div>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div id="appScreen"></div>
    </div>

    <script>
        const steps = [
            {
                stepNum: 1,
                title: "Let's map out your income horizon.",
                subtext: "To accurately protect your lifestyle, we evaluate your household earning power.",
                insight: "💡 Insight: Protecting your current earning trajectory ensures your household's standard of living stays secure.",
                type: "number",
                placeholder: "e.g., 85000",
                label: "Annual Household Income ($)"
            },
            {
                stepNum: 2,
                title: "What major liabilities are you managing?",
                subtext: "Entering your mortgage balance helps calculate exact debt elimination targets.",
                insight: "💡 Insight: Most families target a policy large enough to completely clear the remaining mortgage balance.",
                type: "number",
                placeholder: "e.g., 250000",
                label: "Remaining Mortgage Balance ($)"
            },
            {
                stepNum: 3,
                title: "Who depends on your income most?",
                subtext: "This dictates whether your plan requires multi-year income replacement or final expense protection.",
                insight: "💡 Insight: Coverage timelines are tailored specifically to your family's unique dependency structure.",
                type: "tiles",
                options: [
                    { text: "Spouse / Partner", val: "Spouse/Partner" },
                    { text: "Young Children", val: "Young Children" },
                    { text: "Adult Dependents", val: "Adult Dependents" },
                    { text: "Just Myself", val: "Just Myself" }
                ]
            },
            {
                stepNum: 4,
                title: "Do you have existing workplace coverage?",
                subtext: "Group term insurance through work is a start, but it typically doesn't follow you if you change jobs.",
                insight: "⚠️ Note: Private policies lock in your health tier permanently, independent of your employer.",
                type: "tiles",
                options: [
                    { text: "None / Not Sure", val: "None" },
                    { text: "Basic Work Policy", val: "Work Group Plan" },
                    { text: "Private Policy", val: "Private Policy" },
                    { text: "Both Work & Private", val: "Both" }
                ]
            },
            {
                stepNum: 5,
                title: "Your Underwriting Baseline",
                subtext: "Age and nicotine usage form the initial carrier underwriting bracket.",
                insight: "🎯 Final Step: This generates your preliminary rate tier estimate.",
                type: "combined"
            }
        ];

        let currentStepIndex = 0;
        let userData = { income: 0, mortgage: 0, dependents: "", coverage: "", age: 0, tobacco: "Non-Tobacco" };

        const appScreen = document.getElementById("appScreen");
        const progressContainer = document.getElementById("progressContainer");
        const stepIndicator = document.getElementById("stepIndicator");
        const progressBar = document.getElementById("progressBar");

        function renderStep() {
            if (currentStepIndex >= steps.length) {
                renderScorecard();
                return;
            }

            let s = steps[currentStepIndex];
            stepIndicator.innerText = `Step ${s.stepNum} of ${steps.length}`;
            progressBar.style.width = `${(s.stepNum / steps.length) * 100}%`;

            let html = `
                <h2>${s.title}</h2>
                <div class="subtext">${s.subtext}</div>
                <div class="value-insight">${s.insight}</div>
            `;

            if (s.type === "number") {
                let currentVal = currentStepIndex === 0 ? (userData.income || "") : (userData.mortgage || "");
                html += `
                    <div class="input-group">
                        <label style="font-size:0.8rem; color:#94a3b8; font-weight:600;">${s.label}</label>
                        <input type="number" id="userInputVal" value="${currentVal}" placeholder="${s.placeholder}" autofocus />
                        <button class="action-btn" onclick="saveNumberInput()">CONTINUE →</button>
                    </div>
                `;
            } else if (s.type === "tiles") {
                html += `<div class="options-grid">`;
                s.options.forEach(opt => {
                    html += `<button class="option-tile" onclick="saveTileInput('${opt.val}')">${opt.text}</button>`;
                });
                html += `</div>`;
            } else if (s.type === "combined") {
                html += `
                    <div class="input-group">
                        <label style="font-size:0.8rem; color:#94a3b8; font-weight:600;">Current Age</label>
                        <input type="number" id="userAgeVal" value="${userData.age || ""}" placeholder="e.g., 38" autofocus />
                        
                        <label style="font-size:0.8rem; color:#94a3b8; font-weight:600; margin-top:10px;">Tobacco / Nicotine Use (Past 12 Months)</label>
                        <div class="options-grid" style="margin-top:5px;">
                            <button class="option-tile ${userData.tobacco === 'Non-Tobacco' ? 'selected' : ''}" onclick="setTobacco('Non-Tobacco', this)">No</button>
                            <button class="option-tile ${userData.tobacco === 'Tobacco' ? 'selected' : ''}" onclick="setTobacco('Tobacco', this)">Yes</button>
                        </div>

                        <button class="action-btn" onclick="saveCombinedInput()">GENERATE SNAPSHOT →</button>
                    </div>
                `;
            }

            appScreen.innerHTML = html;
        }

        function saveNumberInput() {
            let val = Number(document.getElementById("userInputVal").value);
            if (!val && val !== 0) return;
            
            if (currentStepIndex === 0) userData.income = val;
            if (currentStepIndex === 1) userData.mortgage = val;

            currentStepIndex++;
            renderStep();
        }

        function saveTileInput(val) {
            if (currentStepIndex === 2) userData.dependents = val;
            if (currentStepIndex === 3) userData.coverage = val;

            currentStepIndex++;
            renderStep();
        }

        function setTobacco(status, btnElement) {
            userData.tobacco = status;
            let parent = btnElement.parentElement;
            parent.querySelectorAll('.option-tile').forEach(b => b.style.borderColor = '#334155');
            btnElement.style.borderColor = '#38bdf8';
        }

        function saveCombinedInput() {
            let ageVal = Number(document.getElementById("userAgeVal").value);
            if (!ageVal) return;
            userData.age = ageVal;

            currentStepIndex++;
            renderStep();
        }

        function renderScorecard() {
            progressContainer.classList.add("hidden");

            // Corrected conditional logic: if single with no family dependents, scale down income replacement gap
            let incomeMultiplier = (userData.dependents === "Just Myself" || userData.dependents === "Adult Dependents") ? 0 : 10;
            let estimatedCoverageNeed = (userData.income * incomeMultiplier) + userData.mortgage;
            
            // Floor baseline for protection gap if figures are minimal
            if (estimatedCoverageNeed < 50000) estimatedCoverageNeed = 100000;

            appScreen.innerHTML = `
                <div style="text-align:center; margin-bottom: 15px;">
                    <h2 style="color: #4ade80;">Snapshot Complete! ✓</h2>
                    <div class="subtext" style="margin-bottom:15px;">Your custom protection profile has been compiled.</div>
                </div>

                <div class="scorecard">
                    <div class="score-title">Estimated Target Protection Gap</div>
                    <div class="score-value">$${estimatedCoverageNeed.toLocaleString()}</div>
                    <div class="score-desc">Calculated using your household liability structure and dependent tier.</div>
                </div>

                <div class="summary-list">
                    <div class="summary-item"><span>Annual Income:</span> <strong>$${userData.income.toLocaleString()}</strong></div>
                    <div class="summary-item"><span>Mortgage Liability:</span> <strong>$${userData.mortgage.toLocaleString()}</strong></div>
                    <div class="summary-item"><span>Primary Focus:</span> <strong>${userData.dependents}</strong></div>
                    <div class="summary-item"><span>Age / Nicotine Profile:</span> <strong>Age ${userData.age} (${userData.tobacco})</strong></div>
                </div>

                <button class="action-btn" onclick="window.location.href='https://calendly.com'">SCHEDULE STRATEGY REVIEW</button>
            `;
        }

        renderStep();
    </script>
</body>
</html>
