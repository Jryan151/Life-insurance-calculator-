<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pong</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #38bdf8;
        }
        canvas {
            background-color: #020617;
            border: 4px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>PONG</h1>
    <canvas id="pongCanvas" width="800" height="400"></canvas>
    <div class="instructions">Use <strong>W / S</strong> or <strong>Up / Down Arrow Keys</strong> to move</div>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        // Game objects
        const player = {
            x: 20,
            y: canvas.height / 2 - 40,
            width: 12,
            height: 80,
            score: 0,
            color: "#38bdf8",
            speed: 6
        };

        const ai = {
            x: canvas.width - 32,
            y: canvas.height / 2 - 40,
            width: 12,
            height: 80,
            score: 0,
            color: "#f43f5e",
            speed: 4.5
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 8,
            speed: 5,
            dx: 5,
            dy: 3,
            color: "#f8fafc"
        };

        // Keyboard controls
        const keys = {};
        window.addEventListener("keydown", (e) => { keys[e.code] = true; });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        function handleInput() {
            if (keys["KeyW"] || keys["ArrowUp"]) {
                player.y -= player.speed;
            }
            if (keys["KeyS"] || keys["ArrowDown"]) {
                player.y += player.speed;
            }

            // Keep player inside bounds
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
            }
        }

        function updateAI() {
            const aiCenter = ai.y + ai.height / 2;
            if (aiCenter < ball.y - 15) {
                ai.y += ai.speed;
            } else if (aiCenter > ball.y + 15) {
                ai.y -= ai.speed;
            }

            if (ai.y < 0) ai.y = 0;
            if (ai.y + ai.height > canvas.height) {
                ai.y = canvas.height - ai.height;
            }
        }

        function moveBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Top/bottom wall collision
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy *= -1;
            }

            // Player paddle collision
            if (
                ball.x - ball.radius < player.x + player.width &&
                ball.x + ball.radius > player.x &&
                ball.y > player.y &&
                ball.y < player.y + player.height
            ) {
                ball.dx *= -1;
                let collidePoint = ball.y - (player.y + player.height / 2);
                ball.dy = collidePoint * 0.15;
            }

            // AI paddle collision
            if (
                ball.x + ball.radius > ai.x &&
                ball.x - ball.radius < ai.x + ai.width &&
                ball.y > ai.y &&
                ball.y < ai.y + ai.height
            ) {
                ball.dx *= -1;
                let collidePoint = ball.y - (ai.y + ai.height / 2);
                ball.dy = collidePoint * 0.15;
            }

            // Score points
            if (ball.x - ball.radius < 0) {
                ai.score++;
                resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;
                resetBall();
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx *= -1;
            ball.dy = (Math.random() * 4) - 2;
        }

        function drawNet() {
            ctx.strokeStyle = "#334155";
            ctx.setLineDash([4, 15]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawText(text, x, y, color, size = "30px") {
            ctx.fillStyle = color;
            ctx.font = `${size} 'Courier New', Courier, monospace`;
            ctx.textAlign = "center";
            ctx.fillText(text, x, y);
        }

        function draw() {
            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawNet();

            drawText(player.score, canvas.width / 4, 50, "#38bdf8", "40px");
            drawText(ai.score, (canvas.width / 4) * 3, 50, "#f43f5e", "40px");

            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = ai.color;
            ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            handleInput();
            updateAI();
            moveBall();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
