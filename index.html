<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Bowman - Core Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 1.5rem;
            color: #38bdf8;
            letter-spacing: 2px;
        }
        .status-hud {
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #94a3b8;
            text-align: center;
        }
        canvas {
            background: linear-gradient(to bottom, #020617, #1e293b);
            border: 3px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: block;
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>BOWMAN DUEL</h1>
    <div class="status-hud" id="hudText">Player 1's Turn: Drag to Aim, Release to Fire!</div>
    
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="controls-hint">Hold & Drag Mouse/Finger anywhere to set Angle & Power</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game State
        let turn = 1; // 1 for Player 1, 2 for Player 2
        let wind = (Math.random() * 0.4) - 0.2; // Random wind factor
        let gameState = "AIMING"; // AIMING, FLYING, GAME_OVER

        // Players
        const p1 = { x: 100, y: 320, health: 100, color: "#38bdf8", score: 0 };
        const p2 = { x: 700, y: 320, health: 100, color: "#f43f5e", score: 0 };

        // Active Arrow in flight
        let arrow = { x: 0, y: 0, vx: 0, vy: 0, active: false };

        // Aiming interaction inputs
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let currentDragX = 0;
        let currentDragY = 0;

        // Input Listeners for Drag-to-Aim Mechanics
        canvas.addEventListener("pointerdown", (e) => {
            if (gameState !== "AIMING") return;
            isDragging = true;
            const rect = canvas.getBoundingClientRect();
            dragStartX = e.clientX - rect.left;
            dragStartY = e.clientY - rect.top;
            currentDragX = dragStartX;
            currentDragY = dragStartY;
        });

        canvas.addEventListener("pointermove", (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            currentDragX = e.clientX - rect.left;
            currentDragY = e.clientY - rect.top;
        });

        canvas.addEventListener("pointerup", (e) => {
            if (!isDragging) return;
            isDragging = false;

            // Calculate vector based on pull-back distance (Angle and Power)
            let shooter = turn === 1 ? p1 : p2;
            let dx = dragStartX - currentDragX; // Pulling back launches forward
            let dy = dragStartY - currentDragY;

            arrow.x = shooter.x;
            arrow.y = shooter.y - 30; // Bowman chest height
            arrow.vx = dx * 0.12;
            arrow.vy = dy * 0.12;
            arrow.active = true;
            gameState = "FLYING";
            document.getElementById("hudText").innerText = "Shot Fired!";
        });

        function updatePhysics() {
            if (!arrow.active) return;

            // Apply gravity and wind
            arrow.vy += 0.25; 
            arrow.vx += wind; 

            arrow.x += arrow.vx;
            arrow.y += arrow.vy;

            // Ground collision boundary
            if (arrow.y > 350) {
                arrow.active = false;
                checkHitOrMiss();
            }

            // Screen boundary check
            if (arrow.x < 0 || arrow.x > canvas.width || arrow.y < 0) {
                arrow.active = false;
                switchTurn();
            }
        }

        function checkHitOrMiss() {
            let target = turn === 1 ? p2 : p1;
            
            // Distance check to see if arrow hit target
            let dist = Math.hypot(arrow.x - target.x, arrow.y - target.y);

            if (dist < 25) {
                target.health -= 35;
                if (target.health <= 0) {
                    target.health = 0;
                    document.getElementById("hudText").innerText = `PLAYER ${turn} WINS THE MATCH!`;
                    gameState = "GAME_OVER";
                    return;
                }
                document.getElementById("hudText").innerText = `Direct Hit! -35 HP`;
            } else {
                document.getElementById("hudText").innerText = `Missed!`;
            }

            setTimeout(switchTurn, 1500);
        }

        function switchTurn() {
            if (gameState === "GAME_OVER") return;
            turn = turn === 1 ? 2 : 1;
            wind = (Math.random() * 0.4) - 0.2; // New random wind
            gameState = "AIMING";
            document.getElementById("hudText").innerText = `Player ${turn}'s Turn (Wind: ${wind > 0 ? 'East' : 'West'} ${(Math.abs(wind)*10).toFixed(1)})`;
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ground Terrain Line
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 350);
            ctx.lineTo(canvas.width, 350);
            ctx.stroke();

            // Draw Players (Stickman Archer style)
            drawArcher(p1.x, p1.y, p1.color, p1.health, "P1");
            drawArcher(p2.x, p2.y, p2.color, p2.health, "P2");

            // Draw Aiming Vector Line (Bow pull-back preview)
            if (isDragging && gameState === "AIMING") {
                let shooter = turn === 1 ? p1 : p2;
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(shooter.x, shooter.y - 30);
                // Draw opposite vector line for arc preview
                let previewX = shooter.x - (currentDragX - dragStartX);
                let previewY = shooter.y - 30 - (currentDragY - dragStartY);
                ctx.lineTo(previewX, previewY);
                ctx.stroke();
            }

            // Draw Flying Arrow
            if (arrow.active) {
                ctx.strokeStyle = "#f8fafc";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(arrow.x, arrow.y);
                ctx.lineTo(arrow.x - arrow.vx * 2, arrow.y - arrow.vy * 2);
                ctx.stroke();
            }
        }

        function drawArcher(x, y, color, health, label) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;

            // Head
            ctx.beginPath();
            ctx.arc(x, y - 45, 10, 0, Math.PI * 2);
            ctx.stroke();

            // Body
            ctx.beginPath();
            ctx.moveTo(x, y - 35);
            ctx.lineTo(x, y - 10);
            // Legs
            ctx.moveTo(x, y - 10);
            ctx.lineTo(x - 12, y);
            ctx.moveTo(x, y - 10);
            ctx.lineTo(x + 12, y);
            ctx.stroke();

            // Health bar above archer
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(x - 20, y - 70, 40, 6);
            ctx.fillStyle = color;
            ctx.fillRect(x - 20, y - 70, (health / 100) * 40, 6);
        }

        function gameLoop() {
            updatePhysics();
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
