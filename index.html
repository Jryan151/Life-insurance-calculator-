<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coverage Finder - DreamCatcher Financial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h2 {
            font-size: 1.25rem;
            color: #38bdf8;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }
        .question-text {
            font-size: 1.05rem;
            margin-bottom: 20px;
            color: #e2e8f0;
            line-height: 1.4;
        }
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button.option-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button.option-btn:hover {
            background: #38bdf8;
            color: #0b0f19;
            border-color: #38bdf8;
            font-weight: 600;
        }
        .result-box {
            text-align: center;
        }
        .policy-tag {
            font-size: 1.5rem;
            color: #4ade80;
            font-weight: bold;
            margin: 15px 0;
        }
        .result-desc {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .cta-btn {
            background: #38bdf8;
            color: #0b0f19;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: display;
        }
        .cta-btn:hover {
            background: #7dd3fc;
        }
        .hidden {
            display: none !important;
        }
        .progress {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="progressIndicator" class="progress">Step 1 of 3</div>
        
        <!-- QUIZ SCREEN -->
        <div id="quizScreen">
            <h2 id="quizTitle">Find Your Ideal Coverage</h2>
            <div id="questionText" class="question-text">Loading question...</div>
            <div id="optionsGroup" class="options-group">
                <!-- Dynamically injected buttons -->
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="resultScreen" class="result-box hidden">
            <h2>Recommended For You</h2>
            <div id="policyRecommendation" class="policy-tag">TERM LIFE INSURANCE</div>
            <div id="policyDescription" class="result-desc">
                Based on your goals, a Term policy provides the highest death benefit protection for the lowest initial cost during your family's core growing years.
            </div>
            <button class="cta-btn" onclick="alert('Redirecting to agent calendar or lead form!')">BOOK YOUR FREE CONSULTATION</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                title: "Primary Objective",
                text: "What is your main financial priority right now?",
                options: [
                    { text: "Protecting my family/mortgage if something happens to me", score: "TERM" },
                    { text: "Building tax-advantaged cash value alongside death benefit", score: "IUL" },
                    { text: "Covering final end-of-life and funeral expenses", score: "FINAL" }
                ]
            },
            {
                title: "Time Horizon",
                text: "How long do you need this specific layer of coverage to last?",
                options: [
                    { text: "A specific window (e.g., 10, 20, or 30 years until retirement/kids grow up)", score: "TERM" },
                    { text: "For the rest of my life with potential cash growth", score: "IUL" },
                    { text: "Lifelong coverage with guaranteed level premiums", score: "FINAL" }
                ]
            },
            {
                title: "Budget & Growth Preference",
                text: "Which statement best describes your budget approach?",
                options: [
                    { text: "Maximum coverage for the lowest current monthly investment", score: "TERM" },
                    { text: "Interested in linking cash value performance to market indexes safely", score: "IUL" },
                    { text: "Simple, predictable permanent coverage that never expires", score: "FINAL" }
                ]
            }
        ];

        let currentStep = 0;
        let scores = { TERM: 0, IUL: 0, FINAL: 0 };

        const progressIndicator = document.getElementById("progressIndicator");
        const quizTitle = document.getElementById("quizTitle");
        const questionText = document.getElementById("questionText");
        const optionsGroup = document.getElementById("optionsGroup");
        const quizScreen = document.getElementById("quizScreen");
        const resultScreen = document.getElementById("resultScreen");

        function loadQuestion() {
            if (currentStep >= questions.length) {
                showResult();
                return;
            }

            let q = questions[currentStep];
            progressIndicator.innerText = `Step ${currentStep + 1} of ${questions.length}`;
            quizTitle.innerText = q.title;
            questionText.innerText = q.text;
            optionsGroup.innerHTML = "";

            q.options.forEach(opt => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.text;
                btn.onclick = () => {
                    scores[opt.score]++;
                    currentStep++;
                    loadQuestion();
                };
                optionsGroup.appendChild(btn);
            });
        }

        function showResult() {
            quizScreen.classList.add("hidden");
            resultScreen.classList.remove("hidden");

            // Find highest scoring category
            let bestMatch = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            
            let recEl = document.getElementById("policyRecommendation");
            let descEl = document.getElementById("policyDescription");

            if (bestMatch === "TERM") {
                recEl.innerText = "TERM LIFE INSURANCE";
                descEl.innerText = "Ideal for your current stage. It provides high-limit income and debt protection at an affordable rate during your peak earning and family-raising years.";
            } else if (bestMatch === "IUL") {
                recEl.innerText = "INDEXED UNIVERSAL LIFE (IUL)";
                descEl.innerText = "Best aligned with your wealth-building goals. It offers permanent lifelong protection combined with cash value growth tied to market indices with downside floor protection.";
            } else {
                recEl.innerText = "FINAL EXPENSE INSURANCE";
                descEl.innerText = "Tailored for lifelong peace of mind, ensuring final arrangements and medical bills are completely covered without burdening loved ones.";
            }
        }

        loadQuestion();
    </script>
</body>
</html>
